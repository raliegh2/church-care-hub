name: Build production artifact

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: church-care-hub-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Publish immutable release assets to the branch
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          rm -rf release-assets
          mkdir -p release-assets
          cp -R dist/. release-assets/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-assets
          if git diff --cached --quiet; then
            echo "Release assets are already current."
            exit 0
          fi
          git commit -m "chore: publish production assets [skip ci]"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
