name: Build production artifact

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          # These are public client-side values (they are shipped in the
          # browser bundle by design). Define them under:
          #   Settings -> Secrets and variables -> Actions
          # Either the Variables tab or the Secrets tab works.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_ORGANIZATION_ID: ${{ vars.VITE_ORGANIZATION_ID || secrets.VITE_ORGANIZATION_ID }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ] || [ -z "$VITE_ORGANIZATION_ID" ]; then
            echo "::error::Missing one or more VITE_ build values. Add VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY and VITE_ORGANIZATION_ID under Settings -> Secrets and variables -> Actions (Variables or Secrets tab)."
            exit 1
          fi
          npm run build

      - name: Verify the config was baked into the bundle
        shell: bash
        run: |
          if ! grep -rq "supabase.co" dist/assets; then
            echo "::error::Built bundle does not contain the Supabase URL; environment injection failed. Refusing to publish a blank-screen build."
            exit 1
          fi

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: church-care-hub-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Publish immutable release assets to the branch
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          rm -rf release-assets
          mkdir -p release-assets
          cp -R dist/. release-assets/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-assets
          if git diff --cached --quiet; then
            echo "Release assets are already current."
            exit 0
          fi
          git commit -m "chore: publish production assets [skip ci]"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
