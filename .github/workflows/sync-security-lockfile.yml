name: Sync security lockfile

on:
  push:
    branches:
      - security/session-isolation-and-brute-force
    paths:
      - package.json
      - .github/workflows/sync-security-lockfile.yml

permissions:
  contents: write

concurrency:
  group: sync-security-lockfile
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out security branch
        uses: actions/checkout@v4
        with:
          ref: security/session-isolation-and-brute-force
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate locked dependency tree
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify high-severity audit is clean
        run: npm audit --audit-level=high

      - name: Publish synchronized lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize secure dependency lockfile [skip ci]"
          git pull --rebase origin security/session-isolation-and-brute-force
          git push origin HEAD:security/session-isolation-and-brute-force
