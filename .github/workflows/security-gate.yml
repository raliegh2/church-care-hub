name: Security and release gate
on:
  pull_request:
    branches: [main, migration/cloudflare]
  push:
    branches: [main, migration/cloudflare]
  schedule:
    - cron: '31 11 * * *'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    name: Security and regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Block high and critical dependency vulnerabilities
        run: npm audit --audit-level=high
      - run: node --test scripts/reliability.test.cjs
      - run: npm run build
      - run: npm run test:cloudflare --if-present
      - run: npm run build:cloudflare --if-present
  deployed-source:
    name: Deployed Cloudflare source
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: migration/cloudflare
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run test:cloudflare
      - run: npm run build:cloudflare
