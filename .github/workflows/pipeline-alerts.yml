name: Pipeline incident alerts
on:
  workflow_run:
    workflows: ['Security and release gate', 'Reliability regressions', 'Security audit', 'Deploy canonical live site', 'Build production artifact', 'Keep Supabase projects active', 'CodeQL', 'Verified Cloudflare release']
    types: [completed]
permissions:
  issues: write
concurrency:
  group: pipeline-incident-${{ github.event.workflow_run.workflow_id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  notify:
    if: (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'migration/cloudflare') && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Privileged job never checks out or executes the triggering commit/artifacts.
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const run = context.payload.workflow_run;
            if (!['success', 'failure', 'timed_out', 'action_required', 'startup_failure'].includes(run.conclusion)) return;
            const {owner, repo} = context.repo;
            const title = '[Pipeline incident] ' + run.name + ' (' + run.head_branch + ')';
            const issues = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state: 'open', creator: 'github-actions[bot]', per_page: 100});
            const incident = issues.find(i => !i.pull_request && i.title === title);
            if (run.conclusion !== 'success' && !incident) {
              await github.rest.issues.create({owner, repo, title, assignees: ['raliegh2'], body: 'Default-branch workflow failed: ' + run.conclusion + '.\n\nEvidence: ' + run.html_url + '\nCommit: ' + run.head_sha + '\n\nInspect the failing step, repair through a pull request, and rerun checks. This does not by itself prove a production outage. Do not post credentials, private logs, or vulnerability details in public issues.'});
            } else if (run.conclusion === 'success' && incident) {
              const opened = Date.parse(incident.created_at);
              if (Date.parse(run.run_started_at) <= opened) return;
              await github.rest.issues.createComment({owner, repo, issue_number: incident.number, body: 'A later run passed: ' + run.html_url});
              await github.rest.issues.update({owner, repo, issue_number: incident.number, state: 'closed', state_reason: 'completed'});
            }
