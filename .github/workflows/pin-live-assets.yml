name: Pin current live assets

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pin-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out proposed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Capture current production bundle
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail

          live_origin="https://church-care-hub.vercel.app"
          html="$(curl --fail --silent --show-error --location "${live_origin}/")"
          js_path="$(printf '%s' "$html" | grep -oE 'src="/assets/[^"]+\.js"' | head -n 1 | cut -d'"' -f2)"
          css_path="$(printf '%s' "$html" | grep -oE 'href="/assets/[^"]+\.css"' | head -n 1 | cut -d'"' -f2)"

          test -n "$js_path"
          test -n "$css_path"

          rm -rf pinned-live-assets
          mkdir -p pinned-live-assets/assets
          curl --fail --silent --show-error --location "${live_origin}${js_path}" -o pinned-live-assets/assets/app.js
          curl --fail --silent --show-error --location "${live_origin}${css_path}" -o pinned-live-assets/assets/base.css

          test "$(wc -c < pinned-live-assets/assets/app.js)" -gt 100000
          test "$(wc -c < pinned-live-assets/assets/base.css)" -gt 1000
          grep -q "supabase" pinned-live-assets/assets/app.js

          printf '%s\n' \
            "origin=${live_origin}" \
            "javascript=${js_path}" \
            "stylesheet=${css_path}" \
            "captured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > pinned-live-assets/source.txt

      - name: Commit immutable asset snapshot
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pinned-live-assets
          if git diff --cached --quiet; then
            echo "Pinned assets are already current."
            exit 0
          fi
          git commit -m "chore: pin current live assets [skip ci]"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
